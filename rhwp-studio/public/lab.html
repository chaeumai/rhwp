<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rhwp AI 작성 표면 Lab</title>
<link rel="icon" href="./favicon.ico">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #d7dbe0;
    --text: #1b1f24;
    --muted: #5c6570;
    --accent: #2d6cdf;
    --ok: #1a7f45;
    --fail: #c0392b;
    --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d;
      --panel: #1f2429;
      --border: #333b44;
      --text: #e6e9ed;
      --muted: #9aa5b1;
      --accent: #6ea3ff;
      --ok: #4ade80;
      --fail: #f87171;
      --code-bg: #12161a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #editor-pane { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #editor-status {
    padding: 6px 12px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--panel);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #editor { flex: 1; width: 100%; border: 0; min-height: 0; }

  /* 탭 — 두 보기 모두 항상 렌더하고 활성만 표시한다(레이아웃 이동 없음). */
  #pane-tabs { display: flex; gap: 4px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
  #pane-tabs button {
    border: 1px solid var(--border); border-bottom: 0; background: var(--panel); color: var(--muted);
    border-radius: 6px 6px 0 0; padding: 5px 14px; font-size: 12px; cursor: pointer;
  }
  #pane-tabs button.active { background: var(--bg); color: var(--text); font-weight: 600; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane[data-active="false"] { display: none; }

  #compare-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #compare-status { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #compare-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  .pdf-pane { margin: 0; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .pdf-pane figcaption {
    padding: 5px 10px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pdf-pane .meta { color: var(--accent); }
  .pdf-pane iframe { flex: 1; width: 100%; border: 0; min-height: 0; background: var(--code-bg); }

  #samples { display: grid; gap: 4px; margin-bottom: 8px; }
  .sample {
    display: flex; flex-direction: column; gap: 1px; text-align: left; width: 100%;
    padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px;
  }
  .sample:hover:not(:disabled) { border-color: var(--accent); }
  .sample.active { border-color: var(--accent); border-width: 2px; padding: 5px 8px; }
  .sample.active > span:first-child { color: var(--accent); font-weight: 600; }
  .sample .note { font-size: 10px; color: var(--muted); }
  #tools { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .section h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  input[type=text], textarea, select {
    font: inherit; width: 100%; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  textarea { resize: vertical; min-height: 46px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  #outline { flex: 1; overflow: auto; padding: 8px 12px; min-height: 120px; }
  #outline .empty { color: var(--muted); font-size: 12px; }
  .node {
    display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left;
    padding: 3px 6px; border: 0; background: none; border-radius: 4px; cursor: pointer;
    font-size: 12px; color: var(--text);
  }
  .node:hover { background: var(--code-bg); }
  .node code { color: var(--accent); font-size: 11px; white-space: nowrap; }
  .node .preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .preview.blank { font-style: italic; opacity: .7; }
  .group { margin: 8px 0 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
  #log {
    height: 190px; overflow: auto; margin: 0; padding: 8px 12px;
    background: var(--code-bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; white-space: pre-wrap; word-break: break-all; border-top: 1px solid var(--border);
  }
  .log-entry { margin-bottom: 6px; }
  .log-entry .ok { color: var(--ok); }
  .log-entry .fail { color: var(--fail); }
  .log-entry .meta { color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); margin: 6px 0 0; }
  #ai-diff:empty { display: none; }
  #ai-diff { margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .diff-row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .diff-row:last-child { border-bottom: 0; }
  .diff-row code { font-size: 10px; color: var(--accent); }
  .diff-row .from { color: var(--muted); text-decoration: line-through; }
  .diff-row .to { color: var(--ok); font-weight: 600; }
  .diff-row.bad .to { color: var(--fail); text-decoration: none; font-weight: 400; }
</style>
</head>
<body>
  <div id="editor-pane">
    <div id="pane-tabs" role="tablist" aria-label="보기 전환">
      <button id="tab-editor" role="tab" aria-selected="true" class="active">편집기</button>
      <button id="tab-compare" role="tab" aria-selected="false">PDF 비교</button>
    </div>
    <div id="editor-status">편집기에 연결하는 중…</div>

    <div id="view-editor" class="pane">
      <iframe id="editor" src="./" title="rhwp 편집기"></iframe>
    </div>

    <div id="view-compare" class="pane">
      <div id="compare-bar">
        <button id="btn-compare" disabled>PDF 비교 생성</button>
        <span id="compare-status">원본과 현재 문서를 각각 PDF로 변환해 나란히 봅니다.</span>
      </div>
      <div id="compare-grid">
        <figure class="pdf-pane">
          <figcaption>원본 <span class="meta" id="pdf-a-meta"></span></figcaption>
          <iframe id="pdf-a" title="원본 PDF"></iframe>
        </figure>
        <figure class="pdf-pane">
          <figcaption>현재 문서 (편집 반영) <span class="meta" id="pdf-b-meta"></span></figcaption>
          <iframe id="pdf-b" title="편집본 PDF"></iframe>
        </figure>
      </div>
    </div>
  </div>

  <div id="tools">
    <div class="section">
      <h2>1. 문서 열기</h2>
      <div id="samples"></div>
      <div class="row">
        <input type="file" id="file" accept=".hwpx,.hwp" style="flex:1">
        <button id="btn-load" disabled>열기</button>
      </div>
      <p class="hint">샘플을 누르면 바로 열립니다. 직접 고른 파일은 [열기]로 엽니다.</p>
    </div>

    <div class="section">
      <h2>2. 도구</h2>
      <div class="row">
        <button id="btn-outline" class="primary" disabled>getOutline</button>
        <button id="btn-revert" disabled>revertLastBatch</button>
        <button id="btn-lock" disabled>입력 잠금: 해제됨</button>
        <button id="btn-export" disabled>exportHwpx</button>
      </div>
    </div>

    <div class="section">
      <h2>3. AI 채움 · 수정</h2>
      <label for="ai-context">사용자 정보 — 제품에서는 세션·DB에서 옵니다</label>
      <textarea id="ai-context" rows="4">멘토 정보: 성명 박현찬, 학번 202312345, 학과 컴퓨터인공지능학부, 연락처 010-1234-5678
회의 정보: 2026년 3월 20일(금) 11:00~12:00, 공과대학 7호관 302호 강의실, 참여 5명
회의 주제: SW전공 멘토링 3주차 - 웹 프론트엔드 실습 코드리뷰
신청 금액: 금50,000원(오만원), 신청 비목: 주식비</textarea>
      <label for="ai-instruction">수정 지시 — 비우면 빈 칸 전체를 채웁니다</label>
      <input type="text" id="ai-instruction" placeholder="예: 회의 장소를 공대 3호관 101호로 바꿔줘">
      <div class="row" style="margin-top:8px">
        <button id="btn-ai" class="primary" disabled>AI 실행</button>
        <button id="btn-ai-apply" disabled>제안 반영</button>
        <button id="btn-ai-discard" disabled>제안 버리기</button>
      </div>
      <p class="hint" id="ai-status">편집기와 프록시가 준비되면 활성화됩니다.</p>
      <div id="ai-diff"></div>
    </div>

    <div class="section">
      <h2>4. 수동 편집 (applyEdits)</h2>
      <label for="edit-path">path — 개요에서 노드를 누르면 채워집니다</label>
      <input type="text" id="edit-path" placeholder="s0/p1/c0/cell3/p0">
      <label for="edit-expected">expectedText — 현재 값. 다르면 적용하지 않습니다</label>
      <textarea id="edit-expected" placeholder="(빈 칸이면 비워 두세요)"></textarea>
      <label for="edit-new">newText</label>
      <textarea id="edit-new" placeholder="넣을 내용"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="btn-apply" class="primary" disabled>적용</button>
        <button id="btn-read" disabled>이 경로 읽기</button>
        <button id="btn-mismatch" disabled>불일치 시험</button>
      </div>
      <p class="hint">불일치 시험은 expectedText를 일부러 틀리게 보내 거부되는지 확인합니다.</p>
    </div>

    <div id="outline"><p class="empty">개요를 아직 읽지 않았습니다.</p></div>
    <pre id="log"></pre>
  </div>

  <script type="module" src="./lab.js"></script>
</body>
</html>
